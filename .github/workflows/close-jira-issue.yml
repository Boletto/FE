name: Close Jira issue
on:
  issues:
    types:
      - closed

jobs:
  close-issue:
    name: Close Jira issue
    runs-on: ubuntu-latest

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Extract Jira issue key from GitHub issue title
        id: extract-key
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          JIRA_KEY=$(echo "$ISSUE_TITLE" | grep -oE '[A-Z]+-[0-9]+')
          echo "JIRA_KEY=$JIRA_KEY" >> $GITHUB_ENV
          
      - name: Update Jira issue content
        if: env.JIRA_KEY != ''
        uses: atlassian/gajira-edit@v3
        with:
          issue: ${{ env.JIRA_KEY }}
          fields: '{"summary": "${{ github.event.issue.title }}", "description": "${{ steps.md2jira.outputs.output-text }}"}'

      - name: Add comment with closing update
        if: env.JIRA_KEY != ''
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ env.JIRA_KEY }}
          body: "GitHub issue has been closed. Refer to the details and final updates here: [${{ github.event.issue.html_url }}](${{ github.event.issue.html_url }})"
      
      - name: Close Jira issue
        if: env.JIRA_KEY != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ env.JIRA_KEY }}
          transition: 완료
